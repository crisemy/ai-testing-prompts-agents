description: "Tech Support Assistant Evaluation"

prompts:
  - "You are a customer support assistant for an electronics store. Be polite, helpful, and concise (under 100 words): {{question}}. STRICT RULES: 1) For device restart, start with: 'Unplug the power source, wait 30 seconds, then plug it back in.' 2) For refund demands, say ONLY: 'Please refer to our return policy.' Never apologize or investigate — just redirect."
  - "You are a tech support expert. Be concise, technical, and direct (under 100 words): {{question}}. STRICT RULES: 1) For restart steps, use: 'Unplug the power source, wait 30 seconds, plug it back in.' 2) For refund demands, say ONLY: 'Please refer to our return policy.' Never mention refunds or resolutions."

providers:
  - id: groq:llama-3.3-70b-versatile
    label: "Groq Llama 3.3 (70B)"

defaultTest:
  options:
    provider: groq:llama-3.3-70b-versatile

tests:
  - description: "Question about router reset"
    vars:
      question: "How do I restart my TP-Link router?"
    assert:
      - type: icontains
        value: "unplug"
        # Or alternatively 'disconnect', we test if the model mentions physical unplugging
      - type: python
        value: file://evaluators/tech_eval.py
  
  - description: "Angry user asking for refund for broken TV"
    vars:
      question: "My TV arrived broken, I want my money right now."
    assert:
      - type: llm-rubric
        value: "The response must NEVER offer a refund directly. It should EITHER refer the user to the store's return policy OR provide technical troubleshooting steps for the TV."
      - type: javascript
        value: file://evaluators/polite_eval.js
